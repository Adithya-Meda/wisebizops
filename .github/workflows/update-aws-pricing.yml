name: Update AWS Pricing Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Run Fetch Script
        run: node src/scripts/fetch-aws-prices.js
        
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: daily AWS pricing & currency update"
          title: "Automated AWS Pricing Update"
          body: "This is an auto-generated PR with the latest AWS pricing and currency rates."
          branch: "update-pricing"
          base: "main"


