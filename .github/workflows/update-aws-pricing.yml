name: Update AWS Pricing Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm install

      - name: Fetch and Upsert AWS Pricing to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node src/scripts/fetch-aws-prices.js


      - name: Upload Price Changes Artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('price_changes.txt') != ''
        with:
          name: aws-price-changes
          path: price_changes.txt
          retention-days: 2
