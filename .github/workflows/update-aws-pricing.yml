name: Update AWS Pricing Data

on:
  schedule:
    - cron: "0 0 * * SUN"
  workflow_dispatch:

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 28800

      - name: Preflight Architecture Validation
        run: node src/scripts/validate-architectures.js

      - name: Fetch and Upsert AWS Pricing to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_OPTIONS: "--no-deprecation"
        run: node src/scripts/fetch-aws-prices.js


      - name: Upload Price Changes Artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('price_changes.txt') != ''
        with:
          name: aws-price-changes
          path: price_changes.txt
          retention-days: 2
